worker_processes 1;
pid /home/xjlab/zhy/all-anbos/ai_rag_website/runtime/nginx-5173.pid;
error_log /home/xjlab/zhy/all-anbos/ai_rag_website/logs/nginx-5173-error.log info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    access_log /home/xjlab/zhy/all-anbos/ai_rag_website/logs/nginx-5173-access.log;
    error_log /home/xjlab/zhy/all-anbos/ai_rag_website/logs/nginx-5173-error.log info;

    server {
        listen 0.0.0.0:5173;
        server_name _;
        include /home/xjlab/zhy/all-anbos/ai_rag_website/runtime/frontend-ip-allowlist.conf;

        client_max_body_size 300m;
        root /home/xjlab/zhy/all-anbos/ai_rag_website/frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
