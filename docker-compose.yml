version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_rag_backend
    env_file:
      - ./backend/.env
    ports:
      - "8004:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/logs:/app/logs
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class sync
      --threads 1
      --timeout 300
      --graceful-timeout 30
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
      --log-level info
    networks:
      - ai_rag_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_rag_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai_rag_net

networks:
  ai_rag_net:
    driver: bridge
