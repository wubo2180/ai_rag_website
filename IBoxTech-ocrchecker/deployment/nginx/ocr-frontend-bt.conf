# OCR 前端站点配置 - 适用于宝塔面板
# 配置文件路径：/www/server/panel/vhost/nginx/ocr-frontend.conf

server {
    # 监听端口（使用 8080 避免与其他服务冲突）
    listen 8080;
    
    # 如果需要监听 IPv6
    # listen [::]:8080;
    
    # 服务器名称（可以改为您的域名）
    server_name _;
    
    # 网站根目录（前端构建输出目录）
    root /home/h3c/workspace/IBoxTech-ocrchecker/frontend/dist;
    index index.html index.htm;
    
    # 字符集
    charset utf-8;
    
    # 日志配置
    access_log /www/wwwlogs/ocr_frontend_access.log;
    error_log /www/wwwlogs/ocr_frontend_error.log;
    
    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types 
        text/plain 
        text/css 
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;
    
    # 静态资源缓存配置（JS、CSS、图片、字体等）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        
        # 如果文件不存在，返回 404 而不是重定向到 index.html
        try_files $uri =404;
    }
    
    # API 请求反向代理到后端服务
    location /api/ {
        # 后端 API 地址（请根据实际情况修改）
        # 如果后端在本机：http://127.0.0.1:5001
        # 如果后端在其他服务器：http://192.168.1.100:5000
        proxy_pass http://127.0.0.1:5001;
        
        # HTTP 版本
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 缓存控制
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # 超时配置（OCR 识别可能耗时较长）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # 缓冲配置
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 文件上传大小限制（支持大文件上传）
        client_max_body_size 100M;
        client_body_buffer_size 10M;
    }
    
    # 前端路由处理（Vue Router history 模式）
    location / {
        # 先尝试访问文件，如果不存在则返回 index.html
        try_files $uri $uri/ /index.html;
        
        # HTML 文件不缓存，确保用户总是获取最新版本
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问备份文件
    location ~* \.(bak|save|old|orig|backup|swp|sql|gz|tar|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # favicon.ico 和 robots.txt 不记录日志
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
    
    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

