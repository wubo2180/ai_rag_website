<!DOCTYPE html>
<html>
<head>
    <title>PDF下载测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        #results { margin-top: 20px; border: 1px solid #ccc; padding: 15px; }
        #pdfCanvas { border: 1px solid #000; margin-top: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>PDF下载和预览测试</h1>
    <p>确保你已经登录系统，并且系统中有ID为1的PDF文件。</p>
    
    <button onclick="testDownload()">测试下载PDF文件</button>
    <button onclick="testPdfJs()">测试PDF.js加载</button>
    <button onclick="clearResults()">清空结果</button>
    
    <div id="results"></div>
    <canvas id="pdfCanvas"></canvas>

    <script>
        // 设置PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function log(message, type = 'info') {
            console.log(message);
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            document.getElementById('results').innerHTML += `<p class="${className}">${message}</p>`;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
        }

        async function testDownload() {
            try {
                log('开始测试下载...');
                
                const token = localStorage.getItem('access_token') || localStorage.getItem('token');
                log(`Token查找结果: ${token ? '找到' : '未找到'}`);
                
                if (!token) {
                    log('❌ 没有找到访问令牌，请先登录系统', 'error');
                    log('提示: 在主应用中登录后，再访问此测试页面');
                    return;
                }

                log(`🔍 发送请求到: /api/files/1/download?preview=true`);
                const response = await fetch('/api/files/1/download?preview=true', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                log(`HTTP响应状态: ${response.status} ${response.statusText}`);
                log(`响应头: ${JSON.stringify([...response.headers.entries()])}`);
                
                if (!response.ok) {
                    const text = await response.text();
                    log(`❌ 请求失败: ${text}`, 'error');
                    return;
                }

                const blob = await response.blob();
                log(`✅ 文件下载成功: ${blob.size} bytes, 类型: ${blob.type}`, 'success');
                
                // 检查是否是PDF
                const arrayBuffer = await blob.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                const header = String.fromCharCode(...uint8Array.slice(0, 4));
                log(`文件头: "${header}" (应该是 "%PDF")`);
                
                if (header !== '%PDF') {
                    log(`❌ 不是有效的PDF文件，可能是HTML错误页面`, 'error');
                    // 尝试输出部分内容
                    const textContent = new TextDecoder().decode(uint8Array.slice(0, 200));
                    log(`前200字符: ${textContent}`, 'error');
                    return;
                }

                log('✅ 验证通过，这是一个有效的PDF文件', 'success');
                
            } catch (error) {
                log(`❌ 下载测试失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        async function testPdfJs() {
            try {
                log('开始测试PDF.js...');
                
                const token = localStorage.getItem('access_token') || localStorage.getItem('token');
                if (!token) {
                    log('❌ 没有找到访问令牌，请先登录系统', 'error');
                    return;
                }

                const response = await fetch('/api/files/1/download?preview=true', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    log(`❌ 文件下载失败: ${response.status}`, 'error');
                    return;
                }

                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                log(`Blob URL创建: ${blobUrl}`);

                log('🚀 开始PDF.js加载...');
                const pdf = await pdfjsLib.getDocument({
                    url: blobUrl,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true
                }).promise;

                log(`✅ PDF加载成功! 页数: ${pdf.numPages}`, 'success');

                // 渲染第一页
                log('🎨 开始渲染第一页...');
                const page = await pdf.getPage(1);
                const canvas = document.getElementById('pdfCanvas');
                const context = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.0 });

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                log('✅ PDF第一页渲染完成!', 'success');

                // 清理
                URL.revokeObjectURL(blobUrl);

            } catch (error) {
                log(`❌ PDF.js测试失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 页面加载时检查环境
        window.addEventListener('load', () => {
            log('📱 测试页面已加载');
            log(`🌐 当前URL: ${window.location.href}`);
            log(`🍪 localStorage中的token: ${localStorage.getItem('access_token') ? '存在' : '不存在'}`);
        });
    </script>
</body>
</html>
