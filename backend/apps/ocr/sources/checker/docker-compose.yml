version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: ocr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ocr_system
      MYSQL_USER: ocr_user
      MYSQL_PASSWORD: ocr_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - ocr-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ocr-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: ocr-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ocr-network

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: your-production-secret-key
      JWT_SECRET_KEY: your-jwt-secret-key
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ocr_user
      MYSQL_PASSWORD: ocr_password
      MYSQL_DB: ocr_system
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: ocr-files
      MINIO_SECURE: false
      REDIS_URL: redis://redis:6379/0
      OCR_USE_GPU: false
      OCR_LANGUAGE: ch
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - redis
      - minio
    volumes:
      - ./backend/logs:/app/logs
      - ocr_models:/app/models
    networks:
      - ocr-network

  # 前端Web服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ocr-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: ocr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./deployment/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - ocr-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ocr_models:
    driver: local

networks:
  ocr-network:
    driver: bridge
